<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';">
  <title>DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; user-select: none;
    }
    .logo { font-size: 44px; margin-bottom: 14px; }
    h1 { font-size: 20px; color: #f8fafc; margin-bottom: 16px; }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid #334155; border-top-color: #4D6BFE;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    p { margin-top: 14px; font-size: 13px; color: #94a3b8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">🐋</div>
  <h1>DeepSeek Harness 正在启动…</h1>
  <div class="spinner"></div>
  <p>首次启动可能需要几秒到几十秒</p>
</body>
</html>
